<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <title>Kelebek - Punto de Venta</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css?v=5">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <header class="app-header">
        <div class="logo">
            <i class="fas fa-cash-register"></i> Kelebek
        </div>
        <div class="worker-badge" onclick="openWorkerModal()">
            <i class="fas fa-user-circle"></i>
            <span id="current-worker-name">Asignar Turno</span>
            <i class="fas fa-chevron-down" style="font-size: 10px; margin-left: 5px;"></i>
        </div>
    </header>

    <main class="main-container" id="view-pos">
        
        <!-- ZONA DE BÚSQUEDA -->
        <section class="search-section">
            <div class="search-container">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="search-input" class="search-box" placeholder="Buscar producto..." autocomplete="off">
            </div>
            <div id="search-dropdown" class="search-dropdown hidden">
                <ul id="search-results" class="dropdown-list"></ul>
                <div id="no-results" class="no-results hidden">No se encontraron productos</div>
            </div>
        </section>

        <!-- TICKET ACTUAL -->
        <section class="ticket-card">
            <div class="ticket-header">
                <h2><i class="fas fa-receipt"></i> Pedido Actual</h2>
                <div style="display: flex; gap: 10px;">
                    <button class="btn-icon text-gold" onclick="cerrarTurno()" title="Cerrar Turno">
                        <i class="fas fa-door-closed"></i>
                    </button>
                    <button class="btn-icon text-danger" onclick="clearCart()" title="Limpiar ticket">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </div>
            </div>
            
            <div id="ticket-items-container" class="ticket-items">
                <p class="empty-msg">Aún no hay productos.</p>
            </div>

            <div class="ticket-footer">
                <div class="total-row">
                    <span>Total:</span>
                    <span id="ticket-total" class="total-amount">0 CUP</span>
                </div>
                
                <div class="change-section">
                    <label for="cash-input">Efectivo recibido</label>
                    <div class="cash-input-wrapper">
                        <input type="number" id="cash-input" placeholder="0" min="0">
                        <span>CUP</span>
                    </div>
                    <div id="change-display" class="change-display">Vuelto: 0 CUP</div>
                </div>

                <button class="btn-checkout" onclick="finalizeTicket()">
                    <i class="fas fa-check-circle"></i> Cobrar Ticket
                </button>
            </div>
        </section>
    </main>

    <!-- VISTA: INVENTARIO -->
    <main id="view-inventory" class="admin-view hidden">
        <div class="admin-header">
            <h2><i class="fas fa-boxes"></i> Productos</h2>
            <button class="btn-add" onclick="openProductModal()"><i class="fas fa-plus"></i> Nuevo</button>
        </div>
        <input type="text" id="inv-search" class="search-box" placeholder="Buscar en productos..." style="margin-bottom: 15px;">
        <ul id="inventory-list" class="admin-list"></ul>
    </main>

    <!-- VISTA: HISTORIAL -->
    <main id="view-history" class="admin-view hidden">
        <div class="admin-header">
            <h2><i class="fas fa-chart-line"></i> Historial (31 días)</h2>
            <button class="btn-clear-day" onclick="cerrarDiaManual()"><i class="fas fa-door-closed"></i> Cerrar Día</button>
        </div>
        
        <div class="summary-cards">
            <div class="card">
                <span>Ventas Hoy</span>
                <strong id="today-total">0 CUP</strong>
            </div>
            <div class="card">
                <span>Tickets Hoy</span>
                <strong id="today-tickets">0</strong>
            </div>
        </div>

        <div id="history-list"></div>
    </main>

    <!-- NAVEGACIÓN INFERIOR -->
    <nav class="bottom-nav">
        <button class="nav-btn active" data-view="pos" onclick="switchView('pos')">
            <i class="fas fa-cash-register"></i><span>Vender</span>
        </button>
        <button class="nav-btn" data-view="inventory" onclick="switchView('inventory')">
            <i class="fas fa-boxes"></i><span>Productos</span>
        </button>
        <button class="nav-btn" data-view="history" onclick="switchView('history')">
            <i class="fas fa-clipboard-list"></i><span>Historial</span>
        </button>
    </nav>

    <!-- MODAL PRODUCTO -->
    <div class="modal" id="product-modal">
        <div class="modal-content">
            <h3 id="modal-title">Agregar Producto</h3>
            <input type="hidden" id="product-id">
            <label>Nombre del producto</label>
            <input type="text" id="product-name" placeholder="Ej: Café expreso">
            <label>Precio (CUP)</label>
            <input type="number" id="product-price" placeholder="0" min="0">
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('product-modal')">Cancelar</button>
                <button class="btn btn-primary" onclick="saveProduct()">Guardar</button>
            </div>
        </div>
    </div>

    <!-- MODAL TRABAJADORES -->
    <div class="modal" id="worker-modal">
        <div class="modal-content">
            <h3>Trabajadores</h3>
            <ul id="worker-list" class="admin-list" style="margin-bottom: 20px; max-height: 200px; overflow-y: auto;"></ul>
            
            <label id="worker-form-label">Agregar nuevo trabajador</label>
            <input type="hidden" id="edit-worker-old-name">
            <input type="text" id="new-worker-name" placeholder="Escribe el nombre">
            <div class="modal-actions" style="justify-content: space-between;">
                <button class="btn btn-secondary" onclick="closeWorkerModal()">Cerrar</button>
                <button class="btn btn-primary" id="btn-save-worker" onclick="saveWorker()">Agregar</button>
            </div>
        </div>
    </div>

    <script src="app.js?v=5"></script>
</body>
</html>
